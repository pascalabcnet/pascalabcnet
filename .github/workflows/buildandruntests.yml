name: Build & Run all tests (release)

on:
  push:
  pull_request:
  workflow_dispatch:

  release:
    types:
      - created

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: cmd

jobs:
  build:

    name: Prepare and build on Windows Server VM
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v2

    - name: Install dependencies into Virtual Environment...
      run: _RegisterHelixNUnit.bat

    - name: Build project in Release-mode, compile Pas-units, run tests
      run: _RebuildReleaseAndRunTestsForGitHubActions.bat
      timeout-minutes: 40
      env:
        PABCNET_BUILD_MODE: Release
        PABCNET_RUN_TESTS:  false
        PABCNET_INC_BUILD:  false
        PABCNET_VERBOSE:    false

    - name: Check PCU-only console mode and ordinary compilation
      run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests\PCUOnlyTests\Test-PCUOnly.ps1 -Target net472
      timeout-minutes: 5

    - name: Check PABCRtl interface operators without compiler warm-up
      run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests\LegacyTestRunnerTests\Test-PABCRtlOperators.ps1
      timeout-minutes: 3

    - name: Check repository contents (warnings)
      working-directory: bin
      run: |
        pabcnetcclear.exe GitIgnoreTester.pas
        if errorlevel 1 exit /b 1
        GitIgnoreTester.exe NoWait WarningsOnly GitHubActions

    #- name: Publish artifacts (5/5)...
